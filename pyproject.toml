[project]
name = "set-fx-candidatos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas-stubs~=3.0.3",
    "playwright>=1.60.0",
    "pydantic-settings>=2.14.1",
    "reportlab>=4.5.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "playwright.*",
    "pandas.*",
    "openpyxl.*",
    "pydantic_settings.*",
]
ignore_missing_imports = true
